<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolySrv — серверы и обновления</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 32px 20px 60px; background: #17212b; color: #e6edf3;
         font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: #8fa3b5; margin-bottom: 26px; font-size: 14px; }
  .card { background: #0f1620; border: 1px solid #22303c; border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .ttl { font-weight: 600; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #3aa675; flex: 0 0 auto;
         box-shadow: 0 0 6px rgba(58,166,117,.55); }
  .dot.bad { background: #d05a5a; box-shadow: 0 0 6px rgba(208,90,90,.5); }
  .dot.idle { background: #6b7f92; box-shadow: none; }
  .name { font-weight: 600; }
  .ping { color: #8fa3b5; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .ping.good { color: #3aa675; }
  .ping.warn { color: #d8a13a; }
  .ping.bad { color: #d05a5a; }
  .addr { color: #7f95a8; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .desc { color: #64798c; font-size: 13px; }
  .badge { margin-left: auto; font-size: 12px; padding: 3px 9px; border-radius: 999px;
           background: #1d2b38; color: #8fa3b5; white-space: nowrap; }
  .badge.tg { background: #2b5278; color: #cfe4ff; }
  a { color: #6ab3f3; }
  code { background: #0b1118; padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  .files { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .files a { text-decoration: none; border: 1px solid #22303c; border-radius: 8px; padding: 7px 12px; font-size: 14px; }
  .files a:hover { background: #16212c; }
  .upd { margin-top: 6px; font-size: 14px; color: #b8c6d4; }
  .foot { margin-top: 28px; color: #64798c; font-size: 13px; }
  code.k { color: #7ee0b8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PolySrv</h1>
  <div class="sub">Серверы, пинг и обновления. Эти же файлы читает приложение при старте.</div>

  <div class="card">
    <div class="ttl">Серверы</div>
    <div id="servers"><div class="addr">загрузка…</div></div>
    <div class="foot" id="checked"></div>
  </div>

  <div class="card">
    <div class="ttl">Обновление</div>
    <div id="update" class="upd">загрузка…</div>
  </div>

  <div class="card">
    <div class="ttl">Файлы</div>
    <div class="files">
      <a href="servers.json">servers.json</a>
      <a href="update.json">update.json</a>
    </div>
  </div>

  <div class="foot">Обновляется автоматически при изменении ветки <code class="k">gh-pages</code>.</div>
</div>

<script>
function endpointOf(s) {
  if (s.host) {
    return {addr: s.host + ':' + (s.port || 443), dc: (s.dc || []).length};
  }
  const dcs = s.dc || [];
  if (!dcs.length) return {addr: '—', dc: 0};
  const main = s.mainDcId || 0;
  let d = dcs.find(x => main && x.id === main) || dcs[0];
  return {addr: d.host + ':' + (d.port || 443), dc: dcs.length};
}

function pingClass(s) {
  if (s.pingMs === undefined || s.pingMs === null || s.pingMs < 0) return 'bad';
  if (s.pingMs < 100) return 'good';
  if (s.pingMs < 300) return 'warn';
  return 'bad';
}

async function loadServers() {
  const box = document.getElementById('servers');
  try {
    const r = await fetch('servers.json?t=' + Date.now(), {cache: 'no-store'});
    const d = await r.json();
    box.innerHTML = '';
    (d.servers || []).forEach(s => {
      const ep = endpointOf(s);
      const el = document.createElement('div');
      el.className = 'row';
      const dot = document.createElement('span');
      dot.className = 'dot' + (s.online === false ? ' bad' : (s.online === true ? '' : ' idle'));
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = s.name || s.id;
      const ping = document.createElement('span');
      ping.className = 'ping ' + pingClass(s);
      ping.textContent = (s.pingMs === undefined || s.pingMs === null || s.pingMs < 0)
        ? 'offline' : (s.pingMs + ' ms');
      const badge = document.createElement('span');
      badge.className = 'badge' + (s.isTelegram ? ' tg' : '');
      badge.textContent = s.isTelegram ? 'Telegram · multi-DC' : 'single-DC';
      const col = document.createElement('span');
      col.style.minWidth = '0';
      const addr = document.createElement('div');
      addr.className = 'addr';
      addr.textContent = ep.addr + (ep.dc > 1 ? '  ·  ' + ep.dc + ' DC' : (s.mainDcId ? '  ·  DC' + s.mainDcId : ''));
      col.appendChild(addr);
      if (s.description) {
        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.textContent = s.description;
        col.appendChild(desc);
      }
      el.appendChild(dot);
      el.appendChild(name);
      el.appendChild(ping);
      el.appendChild(col);
      el.appendChild(badge);
      box.appendChild(el);
    });
    if (!box.children.length) box.innerHTML = '<div class="addr">серверов нет</div>';
    document.getElementById('checked').textContent = d.checkedAt
      ? 'пинг проверен: ' + d.checkedAt : '';
  } catch (e) {
    box.innerHTML = '<div class="addr">не удалось загрузить servers.json</div>';
  }
}

async function loadUpdate() {
  const box = document.getElementById('update');
  try {
    const r = await fetch('update.json?t=' + Date.now(), {cache: 'no-store'});
    const d = await r.json();
    let html = 'версия <b>' + (d.version || '?') + '</b> (code ' + (d.versionCode || '?') + ')';
    if (d.updated) html += ' · обновлено ' + d.updated;
    if (d.apkUrl) {
      html += '<br><a href="' + d.apkUrl + '">Скачать APK</a>';
      if (d.sha256) html += ' <span class="addr">sha256 ' + d.sha256.slice(0, 16) + '…</span>';
    }
    if (d.notes) html += '<br>' + d.notes;
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<div class="addr">не удалось загрузить update.json</div>';
  }
}

loadServers();
loadUpdate();
setInterval(() => { loadServers(); loadUpdate(); }, 60000);
</script>
</body>
</html>
